<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>tocca i piedi a fidosesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --c1:#FF6B9D; --c2:#FFC93C;
    --bg1:#0F0B1E; --bg2:#1A1030;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 50% 15%, color-mix(in srgb, var(--c1) 18%, transparent), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    user-select:none;
    transition: background 0.6s ease;
  }
  canvas#bgCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  canvas#confetti{ position:fixed; inset:0; width:100%; height:100%; z-index:40; pointer-events:none; }

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px; z-index:30;
  }
  .icon-btn{
    width:42px; height:42px; border-radius:999px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; color:#fff;
    transition: transform .15s ease, background .2s ease;
  }
  .icon-btn:active{ transform:scale(0.88); }
  .icon-btn:hover{ background:rgba(255,255,255,0.15); }
  .top-right{ display:flex; gap:8px; }

  /* ── stat pills ──────────────────────────────────────── */
  .stats-row{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    margin-bottom:14px; z-index:10; position:relative; max-width:92vw;
  }
  .stat-pill{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    padding:7px 14px; border-radius:999px;
    font-size:11px; letter-spacing:0.03em;
    display:flex; align-items:center; gap:6px;
    color:rgba(255,255,255,0.75);
    white-space:nowrap;
  }
  .stat-pill b{ color:#fff; font-weight:700; }

  /* ── title ───────────────────────────────────────────── */
  h1{
    font-family:'Fredoka',sans-serif;
    font-size:clamp(26px,6vw,46px);
    text-align:center;
    margin:0 0 4px;
    padding:0 20px;
    background:linear-gradient(90deg, var(--c1), var(--c2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 4px 30px rgba(0,0,0,0.4);
    transition: background 0.6s ease;
    z-index:10; position:relative;
  }
  .subtitle{
    color:rgba(255,255,255,0.45); font-size:13px; margin:0 0 20px;
    z-index:10; position:relative; text-align:center; padding:0 20px;
  }

  /* ── progress to next milestone ─────────────────────── */
  .progress-wrap{
    width:min(320px, 80vw); margin-bottom:22px; z-index:10; position:relative;
  }
  .progress-label{
    display:flex; justify-content:space-between; font-size:10px;
    color:rgba(255,255,255,0.4); margin-bottom:5px; letter-spacing:0.04em;
  }
  .progress-track{
    height:8px; border-radius:999px; background:rgba(255,255,255,0.08);
    overflow:hidden; border:1px solid rgba(255,255,255,0.1);
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--c1), var(--c2));
    transition: width 0.35s cubic-bezier(.34,1.56,.64,1), background 0.6s ease;
    width:0%;
  }

  /* ── the big button ──────────────────────────────────── */
  .btn-wrap{ position:relative; z-index:10; }
  #tapBtn{
    width:220px; height:220px; border-radius:50%;
    font-size:92px; line-height:1;
    background:linear-gradient(145deg, var(--c1), var(--c2));
    border:6px solid rgba(255,255,255,0.25);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), background .6s ease;
    animation: glowPulse 2.2s ease-in-out infinite;
    touch-action: manipulation;
    position:relative;
  }
  #tapBtn:active{ filter:brightness(1.1); }

  .combo-pill{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    padding:6px 16px; border-radius:999px; font-weight:700; font-size:13px;
    white-space:nowrap; opacity:0; pointer-events:none;
    animation: comboWiggle 0.35s ease-in-out infinite;
  }
  .combo-pill.show{ opacity:1; }

  .footer-hint{ color:rgba(255,255,255,0.28); font-size:11px; margin-top:26px; z-index:10; position:relative; letter-spacing:0.02em; }

  /* ── achievements panel ──────────────────────────────── */
  .panel-overlay{
    position:fixed; inset:0; background:rgba(5,3,12,0.72); backdrop-filter: blur(6px);
    z-index:50; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    padding:20px;
  }
  .panel-overlay.open{ opacity:1; pointer-events:auto; }
  .panel{
    background:linear-gradient(160deg,#1B1330,#0F0B1E);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px; padding:26px; width:min(420px,100%); max-height:80vh; overflow-y:auto;
    transform:scale(0.92); transition:transform .25s ease;
  }
  .panel-overlay.open .panel{ transform:scale(1); }
  .panel h2{ font-family:'Fredoka',sans-serif; margin:0 0 4px; font-size:22px; }
  .panel p.sub{ color:rgba(255,255,255,0.4); font-size:12px; margin:0 0 18px; }
  .ach-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px;
    background:rgba(255,255,255,0.03); margin-bottom:8px; border:1px solid rgba(255,255,255,0.06);
  }
  .ach-item.unlocked{ background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.15); }
  .ach-icon{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; background:rgba(255,255,255,0.06); flex-shrink:0;
  }
  .ach-item.unlocked .ach-icon{ background:linear-gradient(145deg, var(--c1), var(--c2)); }
  .ach-text{ flex:1; }
  .ach-title{ font-size:13px; font-weight:600; }
  .ach-item:not(.unlocked) .ach-title{ color:rgba(255,255,255,0.35); }
  .ach-desc{ font-size:11px; color:rgba(255,255,255,0.4); margin-top:1px; }
  .panel-close{
    margin-top:16px; width:100%; padding:12px; border-radius:12px; border:none;
    background:linear-gradient(90deg, var(--c1), var(--c2)); color:#fff; font-weight:700;
    font-family:inherit; font-size:13px; cursor:pointer;
  }

  /* ── toast ───────────────────────────────────────────── */
  #toastLayer{ position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{
    background:rgba(20,14,36,0.92); border:1px solid rgba(255,255,255,0.15);
    padding:10px 18px; border-radius:12px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:8px; box-shadow:0 8px 30px rgba(0,0,0,0.4);
    animation: toastIn 0.35s ease forwards, toastOut 0.35s ease forwards 2.2s;
    white-space:nowrap;
  }

  /* ── milestone banner ────────────────────────────────── */
  #milestoneLayer{ position:fixed; left:50%; top:26%; transform:translate(-50%,-50%); z-index:55; pointer-events:none; }
  .milestone-banner{
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; color:#fff;
    background:linear-gradient(90deg, var(--c1), var(--c2));
    padding:16px 32px; border-radius:18px; text-align:center; white-space:nowrap;
    box-shadow:0 10px 50px rgba(0,0,0,0.5);
    animation: milestonePop 1.7s ease forwards;
  }

  /* ── critical flash ──────────────────────────────────── */
  #critFlash{
    position:fixed; inset:0; z-index:35; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35), transparent 60%);
  }
  #critFlash.flash{ animation: critFlash 0.35s ease; }

  /* ── ambient decorative feet ─────────────────────────── */
  .bg-foot{ position:fixed; font-size:28px; opacity:0.08; pointer-events:none; z-index:0; animation: floatBg 6s ease-in-out infinite; }

  /* ── keyframes ───────────────────────────────────────── */
  @keyframes floatBg{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-18px) rotate(6deg);} }
  @keyframes shakeScreen{ 0%,100%{ transform:translate(0,0);} 25%{ transform:translate(-6px,3px);} 50%{ transform:translate(6px,-3px);} 75%{ transform:translate(-4px,-2px);} }
  .shake{ animation: shakeScreen 0.22s ease; }
  @keyframes popFly{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(0.5);} 15%{ opacity:1; transform:translate(-50%,-50%) scale(1.1);} 100%{ opacity:0; transform:translate(-50%,-160%) scale(1);} }
  @keyframes particleOut{ 0%{ opacity:1; transform:translate(-50%,-50%) rotate(0) scale(1);} 100%{ opacity:0; transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.4);} }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 40px 10px rgba(255,255,255,0.15);} 50%{ box-shadow:0 0 70px 22px rgba(255,255,255,0.28);} }
  @keyframes comboWiggle{ 0%,100%{ transform:translateX(-50%) rotate(-3deg);} 50%{ transform:translateX(-50%) rotate(3deg);} }
  @keyframes milestonePop{ 0%{ opacity:0; transform:scale(0.4) rotate(-6deg);} 15%{ opacity:1; transform:scale(1.15) rotate(2deg);} 25%{ transform:scale(1) rotate(0);} 85%{ opacity:1;} 100%{ opacity:0; transform:scale(0.9) translateY(-30px);} }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-10px) scale(0.9);} to{ opacity:1; transform:translateY(0) scale(1);} }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(-10px) scale(0.9);} }
  @keyframes critFlash{ 0%{ opacity:0;} 30%{ opacity:1;} 100%{ opacity:0;} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; transition-duration:0.001s !important; }
  }
</style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <canvas id="confetti"></canvas>
  <div id="critFlash"></div>
  <div id="toastLayer"></div>
  <div id="milestoneLayer"></div>

  <div class="topbar">
    <button class="icon-btn" id="achBtn" title="Traguardi" aria-label="Traguardi">🏆</button>
    <div class="top-right">
      <button class="icon-btn" id="resetBtn" title="Reset" aria-label="Reset">↺</button>
      <button class="icon-btn" id="muteBtn" title="Audio" aria-label="Audio">🔊</button>
    </div>
  </div>

  <div id="pageWrap">
    <h1>tocca i piedi a fidosesk</h1>
    <p class="subtitle">l'unico vero obiettivo della tua giornata</p>

    <div class="stats-row">
      <div class="stat-pill">👣 <b id="statCount">0</b> tocchi</div>
      <div class="stat-pill">🔥 best combo <b id="statBestCombo">0</b></div>
      <div class="stat-pill">⚡ <b id="statCrit">0</b> critici</div>
      <div class="stat-pill">📈 <b id="statTps">0.0</b> t/s</div>
      <div class="stat-pill">⏱ <b id="statTime">00:00</b></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label"><span id="progLabel">prossimo traguardo: 10</span><span id="progCount">0/10</span></div>
      <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    </div>

    <div class="btn-wrap">
      <div class="combo-pill" id="comboPill">🔥 x0 combo</div>
      <button id="tapBtn" aria-label="Tocca i piedi">🦶</button>
    </div>

    <p class="footer-hint">continua a toccare, non fermarti mai · barra spaziatrice funziona anche</p>
  </div>

  <div class="panel-overlay" id="achOverlay">
    <div class="panel">
      <h2>🏆 Traguardi</h2>
      <p class="sub">sblocca tutto continuando a toccare i piedi</p>
      <div id="achList"></div>
      <button class="panel-close" id="achClose">chiudi</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ═══════════════════════ STATE ═══════════════════════
  const state = {
    count: 0,
    combo: 0,
    bestCombo: 0,
    criticals: 0,
    muted: false,
    startTime: Date.now(),
    tapTimes: [],
    seenMilestones: new Set(),
    unlockedAchievements: new Set(),
  };

  const PALETTES = [
    ["#FF6B9D", "#FFC93C"],
    ["#7C3AED", "#22D3EE"],
    ["#FF5E5B", "#FFED66"],
    ["#00C9A7", "#FFC75F"],
    ["#845EC2", "#FF6F91"],
    ["#00D2FC", "#F9F871"],
  ];
  let paletteIdx = 0;

  const MILESTONES = [
    { at: 10, text: "RISCALDAMENTO 🔥" },
    { at: 25, text: "PIEDOMANIA 🦶" },
    { at: 50, text: "SEI UN PROFESSIONISTA" },
    { at: 100, text: "LEGGENDA DEI PIEDI 👑" },
    { at: 200, text: "FIDOSESK È FIERO DI TE" },
    { at: 350, text: "OLTRE OGNI LIMITE 🚀" },
    { at: 500, text: "MEZZO MIGLIAIO DI PIEDI" },
    { at: 1000, text: "MITO ASSOLUTO ✨" },
  ];

  const ACHIEVEMENTS = [
    { id: "first", icon: "👣", title: "Primo passo", desc: "tocca una volta", check: s => s.count >= 1 },
    { id: "combo10", icon: "🔥", title: "In fiamme", desc: "combo x10", check: s => s.bestCombo >= 10 },
    { id: "combo25", icon: "⚡", title: "Fulmineo", desc: "combo x25", check: s => s.bestCombo >= 25 },
    { id: "taps100", icon: "💯", title: "Centone", desc: "100 tocchi totali", check: s => s.count >= 100 },
    { id: "taps500", icon: "🏅", title: "Instancabile", desc: "500 tocchi totali", check: s => s.count >= 500 },
    { id: "crit1", icon: "✨", title: "Colpo fortunato", desc: "primo tocco critico", check: s => s.criticals >= 1 },
    { id: "crit10", icon: "💥", title: "Cacciatore di critici", desc: "10 tocchi critici", check: s => s.criticals >= 10 },
    { id: "taps1000", icon: "👑", title: "Il migliore", desc: "1000 tocchi totali", check: s => s.count >= 1000 },
  ];

  // ═══════════════════════ AUDIO SYNTH ═══════════════════════
  let actx = null;
  function getCtx(){
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
    }
    if(actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone({freq=440, dur=0.12, type="sine", vol=0.16, sweepTo=null, delay=0}){
    if(state.muted) return;
    const ctx = getCtx();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0+dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }
  function playTap(comboLevel){
    const base = 320 + Math.min(comboLevel,12)*14;
    tone({freq:base, sweepTo:base*1.7, dur:0.1, type:"triangle", vol:0.14});
  }
  function playCritical(){
    tone({freq:660, sweepTo:1320, dur:0.18, type:"square", vol:0.16});
    tone({freq:990, sweepTo:1760, dur:0.22, type:"sine", vol:0.1, delay:0.04});
  }
  function playMilestone(){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=> tone({freq:f, dur:0.22, type:"square", vol:0.12, delay:i*0.09}));
  }
  function playShake(){ tone({freq:90, sweepTo:45, dur:0.28, type:"sawtooth", vol:0.2}); }
  function playAchievement(){
    tone({freq:784, dur:0.12, type:"triangle", vol:0.13});
    tone({freq:988, dur:0.16, type:"triangle", vol:0.13, delay:0.1});
  }

  // ═══════════════════════ DOM REFS ═══════════════════════
  const $ = id => document.getElementById(id);
  const tapBtn = $("tapBtn");
  const pageWrap = $("pageWrap");
  const comboPill = $("comboPill");
  const statCount = $("statCount");
  const statBestCombo = $("statBestCombo");
  const statCrit = $("statCrit");
  const statTps = $("statTps");
  const statTime = $("statTime");
  const progFill = $("progFill");
  const progLabel = $("progLabel");
  const progCount = $("progCount");
  const toastLayer = $("toastLayer");
  const milestoneLayer = $("milestoneLayer");
  const critFlash = $("critFlash");
  const muteBtn = $("muteBtn");
  const resetBtn = $("resetBtn");
  const achBtn = $("achBtn");
  const achOverlay = $("achOverlay");
  const achClose = $("achClose");
  const achList = $("achList");

  let comboTimer = null;

  // ═══════════════════════ PALETTE / SHAKE ═══════════════════════
  function applyPalette(){
    const [c1,c2] = PALETTES[paletteIdx];
    document.documentElement.style.setProperty("--c1", c1);
    document.documentElement.style.setProperty("--c2", c2);
  }
  function triggerShake(){
    pageWrap.classList.add("shake");
    setTimeout(()=> pageWrap.classList.remove("shake"), 220);
  }

  // ═══════════════════════ PARTICLES ═══════════════════════
  const FOOT_VARIANTS = ["🦶","🦶🏻","🦶🏼","🦶🏽","🦶🏾","🦶🏿"];
  function spawnBurst(x, y, big){
    const n = big ? 20 : 10;
    for(let i=0;i<n;i++){
      const span = document.createElement("span");
      const angle = Math.random()*Math.PI*2;
      const dist = (big ? 90 : 60) + Math.random()*(big?90:70);
      const rot = (Math.random()-0.5)*240;
      const size = (big ? 18 : 14) + Math.random()*16;
      const dur = 500 + Math.random()*350;
      span.textContent = FOOT_VARIANTS[Math.floor(Math.random()*FOOT_VARIANTS.length)];
      span.style.cssText = `position:fixed; left:${x}px; top:${y}px; font-size:${size}px; z-index:32; pointer-events:none;`+
        `--tx:${Math.cos(angle)*dist}px; --ty:${Math.sin(angle)*dist}px; --rot:${rot}deg;`+
        `animation: particleOut ${dur}ms ease-out forwards;`;
      document.body.appendChild(span);
      setTimeout(()=> span.remove(), dur+50);
    }
  }
  function spawnPop(x, y, text, color){
    const span = document.createElement("span");
    span.textContent = text;
    span.style.cssText = `position:fixed; left:${x}px; top:${y}px; z-index:33; pointer-events:none; font-weight:800; font-size:22px; color:${color}; text-shadow:0 2px 10px rgba(0,0,0,0.4); animation: popFly 700ms ease-out forwards;`;
    document.body.appendChild(span);
    setTimeout(()=> span.remove(), 720);
  }

  // ═══════════════════════ TOASTS ═══════════════════════
  function showToast(text){
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = text;
    toastLayer.appendChild(el);
    setTimeout(()=> el.remove(), 2600);
  }
  function showMilestone(text){
    const el = document.createElement("div");
    el.className = "milestone-banner";
    el.textContent = text;
    milestoneLayer.appendChild(el);
    setTimeout(()=> el.remove(), 1700);
  }

  // ═══════════════════════ CONFETTI ═══════════════════════
  const confettiCanvas = $("confetti");
  const cctx = confettiCanvas.getContext("2d");
  let confettiParticles = [];
  function resizeConfetti(){
    confettiCanvas.width = window.innerWidth * devicePixelRatio;
    confettiCanvas.height = window.innerHeight * devicePixelRatio;
    confettiCanvas.style.width = window.innerWidth+"px";
    confettiCanvas.style.height = window.innerHeight+"px";
    cctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resizeConfetti();
  window.addEventListener("resize", resizeConfetti);

  function launchConfetti(){
    const [c1,c2] = PALETTES[paletteIdx];
    const colors = [c1,c2,"#ffffff"];
    for(let i=0;i<90;i++){
      confettiParticles.push({
        x: window.innerWidth/2,
        y: window.innerHeight*0.28,
        vx: (Math.random()-0.5)*14,
        vy: -Math.random()*10-4,
        g: 0.32+Math.random()*0.15,
        size: 5+Math.random()*6,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 90+Math.random()*40,
      });
    }
  }
  function confettiLoop(){
    cctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    confettiParticles = confettiParticles.filter(p => p.life < p.maxLife);
    for(const p of confettiParticles){
      p.vy += p.g*0.15;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      const alpha = Math.max(0, 1 - p.life/p.maxLife);
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.globalAlpha = alpha;
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      cctx.restore();
    }
    requestAnimationFrame(confettiLoop);
  }
  confettiLoop();

  // ═══════════════════════ AMBIENT BG (parallax feet + connecting lines) ═══════════════════════
  const bgCanvas = $("bgCanvas");
  const bctx = bgCanvas.getContext("2d");
  let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
  function resizeBg(){
    bgCanvas.width = window.innerWidth * devicePixelRatio;
    bgCanvas.height = window.innerHeight * devicePixelRatio;
    bgCanvas.style.width = window.innerWidth+"px";
    bgCanvas.style.height = window.innerHeight+"px";
    bctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resizeBg();
  window.addEventListener("resize", resizeBg);
  window.addEventListener("mousemove", e=>{ mouseX = e.clientX; mouseY = e.clientY; });

  const bgDots = Array.from({length: 34}).map(()=> ({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: 1+Math.random()*1.8,
    depth: 0.2+Math.random()*0.8,
    baseX: 0, baseY: 0,
  }));
  bgDots.forEach(d=>{ d.baseX = d.x; d.baseY = d.y; });

  function bgLoop(){
    bctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    const [c1] = PALETTES[paletteIdx];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    const px = (mouseX-cx)/cx, py = (mouseY-cy)/cy;

    for(const d of bgDots){
      const ox = d.baseX + px * 18 * d.depth;
      const oy = d.baseY + py * 18 * d.depth;
      bctx.beginPath();
      bctx.arc(ox, oy, d.r, 0, Math.PI*2);
      bctx.fillStyle = c1 + "55";
      bctx.fill();
    }
    // faint connecting lines between near dots
    bctx.strokeStyle = c1 + "18";
    bctx.lineWidth = 1;
    for(let i=0;i<bgDots.length;i++){
      for(let j=i+1;j<bgDots.length;j++){
        const a = bgDots[i], b = bgDots[j];
        const dx = a.baseX-b.baseX, dy = a.baseY-b.baseY;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 140){
          bctx.beginPath();
          bctx.moveTo(a.baseX + px*18*a.depth, a.baseY + py*18*a.depth);
          bctx.lineTo(b.baseX + px*18*b.depth, b.baseY + py*18*b.depth);
          bctx.stroke();
        }
      }
    }
    requestAnimationFrame(bgLoop);
  }
  bgLoop();

  // floating decorative foot emojis (DOM, cheap)
  for(let i=0;i<8;i++){
    const el = document.createElement("div");
    el.className = "bg-foot";
    el.textContent = "🦶";
    el.style.left = ((i*47)%100)+"vw";
    el.style.top = ((i*31)%100)+"vh";
    el.style.animationDelay = (i*0.7)+"s";
    document.body.appendChild(el);
  }

  // ═══════════════════════ ACHIEVEMENTS PANEL ═══════════════════════
  function renderAchievements(){
    achList.innerHTML = "";
    for(const a of ACHIEVEMENTS){
      const unlocked = state.unlockedAchievements.has(a.id);
      const row = document.createElement("div");
      row.className = "ach-item" + (unlocked ? " unlocked" : "");
      row.innerHTML = `<div class="ach-icon">${unlocked ? a.icon : "🔒"}</div>
        <div class="ach-text"><div class="ach-title">${a.title}</div><div class="ach-desc">${a.desc}</div></div>`;
      achList.appendChild(row);
    }
  }
  function checkAchievements(){
    for(const a of ACHIEVEMENTS){
      if(!state.unlockedAchievements.has(a.id) && a.check(state)){
        state.unlockedAchievements.add(a.id);
        showToast(`🏆 sbloccato: ${a.title}`);
        playAchievement();
      }
    }
  }

  // ═══════════════════════ MILESTONE / PROGRESS ═══════════════════════
  function nextMilestone(){
    return MILESTONES.find(m => m.at > state.count) || null;
  }
  function updateProgress(){
    const nm = nextMilestone();
    if(!nm){
      progLabel.textContent = "tutti i traguardi raggiunti ✨";
      progCount.textContent = state.count;
      progFill.style.width = "100%";
      return;
    }
    const prevAt = [...MILESTONES].reverse().find(m => m.at <= state.count)?.at || 0;
    const span = nm.at - prevAt;
    const done = state.count - prevAt;
    progLabel.textContent = `prossimo traguardo: ${nm.at}`;
    progCount.textContent = `${state.count}/${nm.at}`;
    progFill.style.width = Math.min(100, (done/span)*100) + "%";
  }

  // ═══════════════════════ STATS LOOP (TPS + timer) ═══════════════════════
  setInterval(()=>{
    const now = Date.now();
    state.tapTimes = state.tapTimes.filter(t => now - t < 3000);
    const tps = state.tapTimes.length / 3;
    statTps.textContent = tps.toFixed(1);

    const elapsed = Math.floor((now - state.startTime)/1000);
    const m = String(Math.floor(elapsed/60)).padStart(2,"0");
    const s = String(elapsed%60).padStart(2,"0");
    statTime.textContent = `${m}:${s}`;
  }, 200);

  // ═══════════════════════ TAP HANDLER ═══════════════════════
  function handleTap(clientX, clientY){
    const rect = tapBtn.getBoundingClientRect();
    const x = clientX ?? (rect.left + rect.width/2);
    const y = clientY ?? (rect.top + rect.height/2);

    const isCritical = Math.random() < 0.05;

    state.count += 1;
    state.combo += 1;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.tapTimes.push(Date.now());
    if(isCritical) state.criticals += 1;

    // audio + haptics
    if(isCritical){ playCritical(); } else { playTap(state.combo); }
    if(navigator.vibrate) navigator.vibrate(isCritical ? [12,20,12] : 8);

    // button squash
    tapBtn.style.transform = "scale(0.86)";
    setTimeout(()=> tapBtn.style.transform = isCritical ? "scale(1.14)" : "scale(1.06)", 80);
    setTimeout(()=> tapBtn.style.transform = "scale(1)", 170);

    // combo pill
    comboPill.textContent = `🔥 x${state.combo} combo`;
    if(state.combo >= 3) comboPill.classList.add("show"); else comboPill.classList.remove("show");
    clearTimeout(comboTimer);
    comboTimer = setTimeout(()=>{ state.combo = 0; comboPill.classList.remove("show"); }, 900);

    // shake + palette every 10
    if(state.count % 10 === 0){
      triggerShake();
      playShake();
      paletteIdx = (paletteIdx+1) % PALETTES.length;
      applyPalette();
    }

    // particles
    spawnBurst(x, y, isCritical);
    spawnPop(x, y, isCritical ? "+5 CRIT!" : "+1", isCritical ? "#FFD93D" : PALETTES[paletteIdx][1]);

    if(isCritical){
      critFlash.classList.remove("flash"); void critFlash.offsetWidth; critFlash.classList.add("flash");
    }

    // milestone check
    const hit = MILESTONES.find(m => m.at === state.count && !state.seenMilestones.has(m.at));
    if(hit){
      state.seenMilestones.add(hit.at);
      showMilestone(hit.text);
      playMilestone();
      launchConfetti();
    }

    checkAchievements();

    // stat pills
    statCount.textContent = state.count;
    statBestCombo.textContent = state.bestCombo;
    statCrit.textContent = state.criticals;
    updateProgress();
  }

  tapBtn.addEventListener("click", (e)=> handleTap(e.clientX, e.clientY));
  window.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
      e.preventDefault();
      const rect = tapBtn.getBoundingClientRect();
      handleTap(rect.left+rect.width/2, rect.top+rect.height/2);
    }
  });

  // ═══════════════════════ TOP CONTROLS ═══════════════════════
  muteBtn.addEventListener("click", ()=>{
    state.muted = !state.muted;
    muteBtn.textContent = state.muted ? "🔇" : "🔊";
  });

  resetBtn.addEventListener("click", ()=>{
    if(!confirm("Sicuro di voler azzerare i tuoi progressi?")) return;
    state.count = 0; state.combo = 0; state.bestCombo = 0; state.criticals = 0;
    state.startTime = Date.now(); state.tapTimes = [];
    state.seenMilestones.clear(); state.unlockedAchievements.clear();
    statCount.textContent = "0"; statBestCombo.textContent = "0"; statCrit.textContent = "0";
    comboPill.classList.remove("show");
    updateProgress();
    renderAchievements();
    showToast("progressi azzerati");
  });

  achBtn.addEventListener("click", ()=>{ renderAchievements(); achOverlay.classList.add("open"); });
  achClose.addEventListener("click", ()=> achOverlay.classList.remove("open"));
  achOverlay.addEventListener("click", (e)=>{ if(e.target === achOverlay) achOverlay.classList.remove("open"); });

  // ═══════════════════════ INIT ═══════════════════════
  applyPalette();
  updateProgress();
  renderAchievements();
})();
</script>
</body>
</html>
